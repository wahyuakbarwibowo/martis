name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Quality Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Verify Dependencies
        run: |
          go mod verify

      - name: Run Static Analysis (go vet)
        run: |
          go vet ./...

      - name: Run Unit Tests
        run: |
          go test -v -race -cover ./...

      - name: Test Cross-Compilation (macOS, Linux, Windows)
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -v .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -v .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -v .
